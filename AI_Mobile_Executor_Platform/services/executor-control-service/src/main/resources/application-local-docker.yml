spring:
  datasource:
    url: jdbc:mysql://localhost:13306/executor_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 16379
      password:

platform:
  control:
    artifacts:
      backend: minio
      minio:
        # Real-device validation should override this with a LAN-reachable host endpoint.
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        bucket: ${MINIO_BUCKET_EXECUTOR_ARTIFACTS:executor-artifacts}
