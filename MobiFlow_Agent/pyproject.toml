[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiflow-agent"
version = "0.1.0"
description = "Typed foundations for the rebuilt MobiFlow Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "langgraph>=1.1.8,<2", "langgraph-checkpoint-sqlite>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["mobiflow_agent", "mobiflow_agent.*"]

[tool.setuptools.package-data]
mobiflow_agent = ["waypoint/sequences/*.json"]
